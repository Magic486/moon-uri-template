name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          moon version --all
          moon update

      - name: Verify mooncakes archive contents
        shell: pwsh
        run: ./tools/check_package_contents.ps1

      - name: Check formatting and public API
        run: |
          moon fmt
          moon fmt --check
          moon check --warn-list +73
          moon info

      - name: Test every supported backend
        run: moon test --target all

      - name: Smoke-test CLI process behavior
        shell: pwsh
        run: ./tools/smoke_cli.ps1

      - name: Differential test against mature implementations
        run: |
          python -m pip install --require-hashes \
            -r tools/differential/requirements.txt
          python tools/differential/compare.py
